# =============================================================================
# NETWORK CONFIGURATION
# =============================================================================
# If your n8n runs in Docker and you want to connect directly:
#
# Option 1: Add to same network as n8n
# Uncomment below and replace 'n8n_network' with your actual n8n network name
#
# networks:
#   default:
#     external: true
#     name: n8n_network
#
# Then in n8n HTTP Request node, use:
#   http://eodhd-candle-aggregator:8765/candles/AAPL
#
# Option 2: Use host network (simpler but less isolated)
# Add to service:
#   network_mode: host
# Then access via localhost:8765 from anywhere on the host
