# Docker Compose for PostgreSQL deployment
# Usage: docker-compose -f docker-compose.postgres.yml up -d
#
# Required environment variables in .env:
#   DATABASE_TYPE=postgres
#   POSTGRES_PASSWORD=your_secure_password

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eodhd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eodhd_candles}
      POSTGRES_USER: ${POSTGRES_USER:-eodhd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eodhd_user} -d ${POSTGRES_DB:-eodhd_candles}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eodhd_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  eodhd-candles:
    build: .
    container_name: eodhd-candle-aggregator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8765}:8765"
      - "${ADMIN_PORT:-5000}:5000"
    environment:
      # EODHD API Key (required)
      - EODHD_API_KEY=${EODHD_API_KEY}

      # API Authentication
      - API_KEY=${API_KEY:-}

      # Default tickers
      - DEFAULT_TICKERS=${DEFAULT_TICKERS:-AAPL,MSFT,GOOGL,TSLA,NVDA}

      # Candle configuration
      - CANDLE_INTERVAL_MINUTES=${CANDLE_INTERVAL_MINUTES:-5}
      - MAX_CANDLES_STORED=${MAX_CANDLES_STORED:-100}
      - MAX_TICKERS=${MAX_TICKERS:-50}

      # WebSocket settings
      - WS_RECONNECT_DELAY=${WS_RECONNECT_DELAY:-5}
      - WS_PING_INTERVAL=${WS_PING_INTERVAL:-30}

      # Database - PostgreSQL
      - DATABASE_TYPE=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-eodhd_candles}
      - POSTGRES_USER=${POSTGRES_USER:-eodhd_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_POOL_MIN=${POSTGRES_POOL_MIN:-2}
      - POSTGRES_POOL_MAX=${POSTGRES_POOL_MAX:-10}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # Admin Web UI
      - ADMIN_ENABLED=${ADMIN_ENABLED:-true}
      - ADMIN_HOST=${ADMIN_HOST:-127.0.0.1}
      - ADMIN_PORT=5000
      - ADMIN_API_URL=http://localhost:8765
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-}
    volumes:
      - candle_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - eodhd_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    name: eodhd_postgres_data
  candle_data:
    name: eodhd_candle_data

networks:
  eodhd_network:
    driver: bridge
