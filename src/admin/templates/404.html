{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<section class="section">
    <div class="container" style="text-align: center; max-width: 600px; margin: 0 auto;">
        <h1 style="font-size: 6rem; color: var(--sqowe-light-purple); margin-bottom: 1rem;">404</h1>
        <h2 style="color: var(--sqowe-dark-purple); margin-bottom: 1rem;">Page Not Found</h2>
        <p style="color: var(--sqowe-light-grey); font-size: var(--font-size-h6); margin-bottom: 2rem;">
            The page you're looking for doesn't exist or has been moved.
        </p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
            Back to Dashboard
        </a>
    </div>
</section>
{% endblock %}
