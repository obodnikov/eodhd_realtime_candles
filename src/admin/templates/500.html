{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<section class="section">
    <div class="container" style="text-align: center; max-width: 600px; margin: 0 auto;">
        <h1 style="font-size: 6rem; color: var(--sqowe-light-purple); margin-bottom: 1rem;">500</h1>
        <h2 style="color: var(--sqowe-dark-purple); margin-bottom: 1rem;">Internal Server Error</h2>
        <p style="color: var(--sqowe-light-grey); font-size: var(--font-size-h6); margin-bottom: 2rem;">
            Something went wrong on our end. Please try again later or contact support if the problem persists.
        </p>
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <button onclick="location.reload()" class="btn btn-secondary">
                Reload Page
            </button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
                Back to Dashboard
            </a>
        </div>
    </div>
</section>
{% endblock %}
