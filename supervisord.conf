[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

# WebSocket worker - handles real-time data and tick processing
# Single process - all tick processing happens here
[program:websocket_worker]
command=python -m src.websocket_worker
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
priority=1

# API worker 00 - handles HTTP requests on port 8765
[program:api_worker_00]
command=python -m src.api_server
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
priority=2
environment=HTTP_PORT="8765"

# API worker 01 - handles HTTP requests on port 8766
[program:api_worker_01]
command=python -m src.api_server
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
priority=2
environment=HTTP_PORT="8766"

# Admin UI - dashboard interface
[program:admin_ui]
command=python -m src.admin.app
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
priority=3
